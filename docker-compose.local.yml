version: "3.9"

# Local PC dashboard — analysis only, no auto-transfers, no scheduler.
# Access at http://localhost:8080 after starting.

services:
  fpl-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: fpl-dashboard
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - .env.local
    environment:
      - DATABASE_PATH=/data/fpl_local.db
      - DRY_RUN=true          # Always true in local dashboard — never submits transfers
    volumes:
      - fpl-local-data:/data
      - .:/app                 # Live-reload: code changes take effect without rebuild
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  fpl-local-data:
    driver: local
