version: "3.9"

services:
  fpl-bot:
    build: .
    container_name: fpl-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/fpl_bot.db
    volumes:
      # Persist SQLite database and logs across container restarts
      - fpl-data:/data
    deploy:
      resources:
        limits:
          memory: 512M      # bot is lightweight; 512M is generous headroom
          cpus: "0.50"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"     # rotate at 10MB
        max-file: "7"       # keep 7 files (70MB max total)
    healthcheck:
      test: ["CMD", "python", "-c", "import src.config.settings"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Watchtower: automatically pulls and redeploys when you push a new image
  # to a registry. Remove this service if you prefer manual deploys (make update).
  watchtower:
    image: containrrr/watchtower
    container_name: fpl-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --cleanup fpl-bot
    # Checks for a new image every hour and redeploys fpl-bot if found.
    # Only useful if you push built images to a registry (ghcr.io, Docker Hub).
    # Comment out this service if you deploy by SSH + git pull instead.
    profiles:
      - registry   # only starts with: docker compose --profile registry up -d

volumes:
  fpl-data:
    driver: local
